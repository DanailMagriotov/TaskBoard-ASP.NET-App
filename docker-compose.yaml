services: 
    sqlserver:
        container_name: sqlserver
        image: mcr.microsoft.com/mssql/server
        ports: 
            - "1433:1433"
        environment:
            - ACCEPT_EULA=Y
            - MSSQL_SA_PASSWORD=yourStrongPassword12#
        volumes: 
            - sqldata:/var/opt/mssql
    web-app:
        container_name: web-app
        build:
            context: .
            dockerfile: Dockerfile
        environment:
            - ASPNETCORE_HTTP_PORTS=80
        ports: 
            - "5000:80"
        depends_on:
            - sqlserver
        restart: on-failure

volumes:
    sqldata:
